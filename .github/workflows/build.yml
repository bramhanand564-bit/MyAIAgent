name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build C++ Llama Engine (Bridge)
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu
        mkdir -p app/src/main/jniLibs/arm64-v8a
        echo 'void dummy() {}' > llama.c
        aarch64-linux-gnu-gcc -shared -fPIC -o app/src/main/jniLibs/arm64-v8a/libllama.so llama.c

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
